name: Release Helm Chart

on:
  push:
    branches: ["main"]
    paths:
      - 'chart/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v5.0.1

      # chart-releaser resolves dependencies through Helm's downloader, which
      # only knows repositories registered in the local config, so the valkey
      # repo has to be added before it runs. `build` reads Chart.lock rather
      # than resolving afresh, which fails loudly if the lock has drifted from
      # Chart.yaml instead of silently rewriting it at release time.
      - name: Resolve chart dependencies
        run: |
          helm repo add valkey https://valkey.io/valkey-helm/
          helm repo update
          helm dependency build chart/

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.7.0
        with:
          charts_dir: .
          skip_existing: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
