name: Release Helm Chart

on:
  push:
    branches: ["main"]
    paths:
      - 'chart/**'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

# The chart release owns this group. It must not share a group with the docs
# deployment: GitHub cancels the waiting request of a group when a higher
# priority one arrives, so a shared group ended the release with "Canceling
# since a higher priority waiting request for pages exists".
concurrency:
  group: "helm-chart-release-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v5.0.1

      # chart-releaser resolves dependencies through Helm's downloader, which
      # only knows repositories registered in the local config, so the valkey
      # repo has to be added before it runs. `build` reads Chart.lock rather
      # than resolving afresh, which fails loudly if the lock has drifted from
      # Chart.yaml instead of silently rewriting it at release time.
      - name: Resolve chart dependencies
        run: |
          helm repo add valkey https://valkey.io/valkey-helm/
          helm repo update
          helm dependency build chart/

      # The chart index and the documentation site share the gh-pages branch.
      # Publishing the index from a branch state that predates the documentation
      # deployment would drop the new site, so the release waits for a running
      # documentation deployment to finish.
      - name: Wait for the documentation deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for _ in $(seq 1 30); do
            running=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "Deploy Docs" --branch "$GITHUB_REF_NAME" --limit 10 --json status --jq '[.[] | select(.status == "in_progress" or .status == "queued")] | length' 2>/dev/null || true)
            if [ -z "${running:-0}" ] || [ "${running:-0}" -eq 0 ]; then
              exit 0
            fi
            echo "waiting for the documentation deployment ($running running)"
            sleep 10
          done
          echo "the documentation deployment is still running, publishing anyway"

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.7.0
        with:
          charts_dir: .
          skip_existing: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
