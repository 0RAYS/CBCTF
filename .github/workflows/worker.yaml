name: Build Worker Image

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'internal/worker/**'
      - 'go.mod'
      - 'go.sum'
      - '.dockerignore'
      - '.github/workflows/worker.yaml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Set build variables
        id: vars
        run: |
          echo "tag=$(date +'%Y%m%d-%H%M')" >> $GITHUB_OUTPUT
          echo "repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')-worker" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push worker image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: worker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.vars.outputs.repo }}:${{ steps.vars.outputs.tag }}
            ghcr.io/${{ steps.vars.outputs.repo }}:latest
          cache-from: type=gha,scope=worker
          cache-to: type=gha,scope=worker,mode=max
