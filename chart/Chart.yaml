apiVersion: v2
name: cbctf
description: A Kubernetes-native CTF competition platform
type: application
version: 0.0.43
appVersion: "latest"
keywords:
  - ctf
  - cybersecurity
  - competition
  - 0RAYS
home: https://github.com/0RAYS/CBCTF
sources:
  - https://github.com/0RAYS/CBCTF
maintainers:
  - name: JBNRZ
dependencies:
  # Cache and Asynq task queue. Every `valkey.*` value in values.yaml is this
  # chart's own; see https://valkey.io/valkey-helm/ for the full set.
  # `helm dependency build chart/` resolves it locally, and the chart release
  # workflow runs `helm dependency update` before packaging.
  - name: valkey
    version: 1.0.0
    repository: https://valkey.io/valkey-helm/
    condition: valkey.enabled
  # Bundled PostgreSQL. Aliased to `postgres` so every `postgres.*` value in
  # values.yaml is this chart's own (see the Bitnami postgresql chart README
  # for the full set).
  - name: postgresql
    version: 18.12.28
    repository: oci://registry-1.docker.io/bitnamicharts
    alias: postgres
    condition: postgres.enabled
