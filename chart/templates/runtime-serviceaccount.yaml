{{/*
The runtime workloads use this ServiceAccount to pull the challenge images
from private registries. It carries the pull secrets and no token, so the
workloads need no permissions of their own.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cbctf.runtimeServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cbctf.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- with (include "cbctf.imagePullSecretList" .) }}
imagePullSecrets:
{{- . | nindent 2 }}
{{- end }}
