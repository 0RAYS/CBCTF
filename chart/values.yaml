# Default values for cbctf.
# Override these values with your own configuration.

# ── CBCTF Application ─────────────────────────────────────────────────────────

image:
  repository: ghcr.io/0rays/cbctf
  pullPolicy: Always
  tag: "latest"

# Timezone for all containers (e.g. "Asia/Shanghai", "UTC"). Leave empty for container default.
timezone: "Asia/Shanghai"

imagePullSecrets: []
# Inline registry credentials — the chart creates a docker registry Secret
# automatically and appends it to imagePullSecrets on chart-managed
# application/database pods and on the runtime ServiceAccount.
imageCredentials:
  registry: ""   # e.g. ghcr.io
  username: ""
  password: ""
nameOverride: ""
fullnameOverride: ""

# Service Account: namespace Role plus narrowly scoped cluster permissions.
serviceAccount:
  create: true
  annotations: {}
  name: ""

# Covers the 30s HTTP drain, task shutdown, and typical cron/log flushing.
# Long-running cron tasks may require a larger operator-selected grace period.
terminationGracePeriodSeconds: 120
# Slow migrations/resource checks must finish before liveness restarts the app.
startupProbe:
  tcpSocket:
    port: http
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 60

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #     - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

resources: {}
  # limits:
  #   cpu: 2000m
  #   memory: 1Gi
  # requests:
  #   cpu: 500m
  #   memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}

# ── Networking ────────────────────────────────────────────────────────────────

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: true
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: cbctf.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: cbctf-tls
  #    hosts:
  #      - cbctf.local

# ── CBCTF App Config ──────────────────────────────────────────────────────────

cbctf:
  # Public URL of the platform (used in emails, links, etc.)
  host: "http://cbctf.local"

  gin:
    mode: release   # debug / release / test
    host: "0.0.0.0"
    port: 8000
    upload:
      picture: 8     # MiB
      challenge: 8   # MiB
      writeup: 8     # MiB
    # Trusted reverse proxy IPs (add your ingress controller pod CIDR)
    proxies:
      - "127.0.0.1"
      - "::1"
    # Browser request Origins allowed by CORS and auth cookie SameSite handling
    origins:
      - "http://cbctf.local"
    ratelimit:
      global: 100
      whitelist:
        - "::1"
        - "127.0.0.1"
    log:
      whitelist:
        - "/metrics"
        - "/platform/*filepath"
        - "/admin/system/status"
    jwt:
      # JWT secret is no longer sourced from the chart: on first boot the server
      # generates a random secret and persists it in the database (settings row
      # `gin.jwt.secret`). Leave empty; rotate later via the admin System page.
      secret: ""
    metrics:
      # IPs allowed to hit /metrics — include Prometheus pod CIDR or exact IPs
      whitelist:
        - "127.0.0.1"
        - "::1"
    pprof:
      # IPs allowed to hit /debug/pprof/* — keep this narrow in production
      whitelist:
        - "127.0.0.1"
        - "::1"

  asynq:
    log:
      level: info
    queues:
      victim: 8
      traffic: 2
      generator: 3
      attachment: 32
      email: 10
      webhook: 15
      image: 10
      # Range instances start and stop as a whole topology, they need their own
      # queue so a batch of instances does not starve the per-team victims.
      range: 2

  gorm:
    postgres:
      # false -> sslmode=disable, true -> sslmode=require
      sslmode: false
      mxopen: 100
      mxidle: 10
    log:
      level: warning   # INFO / WARNING / ERROR / SILENT
      # Slow query threshold
      slow_threshold: 500ms

  k8s:
    capture: "ghcr.io/domcyrus/rustnet:latest"
    capture_enabled: true
    generator_image: "ghcr.io/0rays/cbctf-generator:latest"
    generator_pool_size: 2
    range:
      # Nodes created concurrently inside one range instance.
      node_concurrency: 8
      # Seconds a range instance may take to become ready.
      ready_timeout: 600
      # Player jumper image. The login user is declared per challenge in
      # the compose file with x-range.ssh_user.
      jumper_image: "ghcr.io/0rays/cbctf-jumper:latest"
    # ServiceAccount of the runtime workloads, it carries the pull secrets of
    # the private registries. Empty uses {fullname}-runtime.
    service_account: ""
    frp:
      "on": false
      frpc: "ghcr.io/fatedier/frpc:v0.72.0"
      nginx: "nginx:latest"
      frps: []

  cheat:
    ip:
      whitelist:
        - "127.0.0.1"
        - "::1"
        - "10.0.0.0/8"
        - "192.168.0.0/16"
        - "172.16.0.0/12"
        - "100.64.0.0/10"

  registration:
    enabled: true
    default_group: 0

  webhook:
    whitelist: []

# ── Persistent Storage for CBCTF data (/app/data) ────────────────────────────

persistence:
  enabled: true
  storageClass: ""     # Leave empty to use cluster default
  accessMode: ReadWriteMany
  size: 20Gi
  existingClaim: ""    # Existing PVC in the release namespace, shared with runtime workloads

# ── PostgreSQL ────────────────────────────────────────────────────────────────
# The database is deployed with the upstream Bitnami postgresql chart
# (https://github.com/bitnami/charts/tree/main/bitnami/postgresql), declared as
# a dependency in Chart.yaml. Every key below except `enabled` and
# `externalHost` is that chart's own value; see its README for the full set
# (replication, TLS, metrics exporter, backup, network policies).

postgres:
  enabled: true
  externalHost: ""     # Required when disabled; hostname/IP used verbatim
  architecture: standalone
  image:
    repository: bitnami/postgresql
    # Bitnami publishes only the `latest` tag for its freely available images.
    tag: latest
    pullPolicy: IfNotPresent
  auth:
    database: "cbctf"
    username: "cbctf"
    password: "change-me-postgres-password"
  primary:
    persistence:
      enabled: true
      storageClass: ""
      size: 5Gi
    resources: {}
      # limits:
      #   cpu: 2000m
      #   memory: 2Gi
      # requests:
      #   cpu: 500m
      #   memory: 512Mi
    # Appended to the generated postgresql.conf
    extendedConfiguration: |
      max_connections = 500
      shared_buffers = 256MB
      wal_level = replica
      listen_addresses = '*'
  service:
    ports:
      postgresql: 5432

# ── Valkey ────────────────────────────────────────────────────────────────────
# The cache and Asynq task queue are deployed with the upstream Valkey chart
# (https://valkey.io/valkey-helm/), not by templates in this chart. Run
# `helm dependency build chart/` once before `helm template` / `helm install`.
# Every key below except `externalHost` and `password` is that chart's own
# value; see its README for the rest (replication, Sentinel, TLS, metrics,
# network policies, pod disruption budgets).

valkey:
  enabled: true
  externalHost: ""     # Required when disabled; hostname/IP used verbatim
  # Password written into the platform configuration. Required when using an
  # external server, and when the bundled instance reads its password from
  # `auth.usersExistingSecret` instead of an inline `auth.aclUsers` entry.
  # Empty by default so it can never silently shadow the inline password below.
  password: ""
  auth:
    enabled: true
    aclUsers:
      default:
        permissions: "~* &* +@all"
        password: "change-me-valkey-password"
  image:
    registry: docker.io
    repository: valkey/valkey
    tag: ""             # Empty uses the chart's appVersion
    pullPolicy: IfNotPresent
  imagePullSecrets: []  # Valkey only; `imagePullSecrets` above covers app + PostgreSQL
  service:
    port: 6379
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""    # Empty uses the cluster default StorageClass
    accessModes:
      - ReadWriteOnce
    # Keeps the volume on `helm uninstall`; remove it by hand afterwards.
    keepOnUninstall: true
  # Asynq task state must survive a Pod replacement, so append-only files are
  # enabled explicitly. This is appended last to the generated configuration
  # and therefore wins over any default.
  extraConfig: |
    appendonly yes
    appendfsync everysec
    save 900 1
    save 300 10
    save 60 10000
  resources: {}
    # limits:
    #   cpu: 2000m
    #   memory: 2Gi
    # requests:
    #   cpu: 500m
    #   memory: 512Mi
  # Readiness is opt-in upstream, but the platform fails its own startup when
  # the queue is unreachable, so fail the Pod early instead.
  readinessProbe:
    enabled: true
